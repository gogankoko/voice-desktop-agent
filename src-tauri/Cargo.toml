[package]
name = "voice-desktop-agent"
version = "0.2.0"
description = "Voice-first Windows desktop assistant"
authors = ["gogankoko"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "voice_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Pinned to the 2.x line: crates.io also publishes 3.0 alphas, which we do not use.
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
# native-tls = Windows SChannel + OS certificate store; avoids the aws-lc-rs C toolchain.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "system-proxy"] }
# Already used by Tauri; we need timeouts, cancellation (select!) and Notify for agent tasks.
tokio = { version = "1", features = ["macros", "sync", "time"] }
# WHATWG URL parsing (IDNA, normalisation) for validating website addresses.
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Networking_NetworkListManager",
    "Win32_Security_Credentials",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
